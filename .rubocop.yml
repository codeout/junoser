inherit_mode:
  merge:
    - Exclude

Gemspec/RequiredRubyVersion:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/AbcSize:
  Enabled: false

Style/Documentation:
  Enabled: false

AllCops:
  NewCops: enable
  # keep it at the oldest ruby the test matrix covers to prevent autocorrect from using a newer idiom
  TargetRubyVersion: 3.3
  Exclude:
    - example/**/*
    - lib/junoser/parser.rb
    - tmp/rule.rb
